<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#17191e;color:#f6f7fb;font:14px -apple-system,BlinkMacSystemFont,sans-serif}h2{margin:0 0 10px}p{color:#b8bfcd;line-height:1.5}input,select{width:100%;padding:11px;background:#272b35;color:#fff;border:1px solid #505564;border-radius:6px;font:inherit}label{display:block;margin:18px 0 7px}button{padding:10px 13px;border:0;border-radius:6px;cursor:pointer;background:#454b59;color:white;font:inherit}button.primary{background:#75a7ff;color:#0c172a}button.danger{background:#74383b}button:disabled{opacity:.4;cursor:default}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.error{color:#ffaaaa;min-height:22px;margin-top:12px}.hint{font-size:12px;color:#adb6c7}</style></head><body>
<h2>Window Presets</h2><p>Save every open browser window as a named layout, then switch between complete video-wall setups.</p>
<label for="name">Save current windows as</label><input id="name" placeholder="e.g. Skydive Wall"><div class="buttons"><button class="primary" id="save">Save New Preset</button><button id="replace">Replace Existing</button></div>
<label for="saved">Saved presets</label><select id="saved" size="6" style="height:135px"></select><div class="buttons"><button class="primary" id="load">Load Selected</button><button class="danger" id="delete">Delete Preset</button></div>
<label>Current windows</label><div class="buttons"><button id="clear">Clear All Windows</button></div><p class="hint" id="count"></p><div class="error" id="error" role="alert"></div>
<script>
const $=id=>document.getElementById(id);
const report=e=>{$('error').textContent=e?.message||String(e)};
async function refresh(){try{const data=await wallPresets.list();const selected=$('saved').value;$('saved').replaceChildren();for(const p of data.names){const option=document.createElement('option');option.value=p.name;option.textContent=`${p.name} (${p.count} windows)`;$('saved').append(option)}if(data.names.some(p=>p.name===selected))$('saved').value=selected;$('count').textContent=`${data.openCount} browser window(s) currently open`;}catch(e){report(e)}}
async function perform(action){$('error').textContent='';try{await action();await refresh()}catch(e){report(e)}}
$('save').onclick=()=>perform(()=>wallPresets.save($('name').value,false));
$('replace').onclick=()=>{const name=$('name').value.trim()||$('saved').value;if(!name)return report('Choose a preset name');if(confirm(`Replace preset "${name}" with all currently open windows?`))perform(()=>wallPresets.save(name,true))};
$('load').onclick=()=>{const name=$('saved').value;if(!name)return;if(confirm(`Close the current browser windows and load "${name}"?`))perform(()=>wallPresets.load(name))};
$('clear').onclick=()=>{if(confirm('Close every browser window? Saved presets will be kept.'))perform(()=>wallPresets.clear())};
$('delete').onclick=()=>{const name=$('saved').value;if(name&&confirm(`Permanently delete preset "${name}"?`))perform(()=>wallPresets.remove(name))};
$('saved').onchange=()=>{$('name').value=$('saved').value};
wallPresets.onChange(refresh);refresh();
</script></body></html>
