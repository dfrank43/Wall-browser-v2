<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#17191e;color:#f5f6f8;font:14px -apple-system,BlinkMacSystemFont,sans-serif;padding:25px}h2{margin:0 0 20px}label{display:block;margin:14px 0 6px;color:#c7cad3}input{width:100%;padding:11px;border:1px solid #505564;border-radius:7px;background:#252934;color:white;font:inherit}button{padding:10px 18px;border:0;border-radius:7px;font:inherit;cursor:pointer}button.primary{background:#6c9eff;color:#101820}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}.error{color:#ff9898;min-height:20px;margin-top:10px}.hint{font-size:12px;color:#b4b9c7;margin-top:15px}</style></head><body>
<h2>Window Settings</h2><form id="settings"><label for="url">URL</label><input id="url" type="text" placeholder="https://example.com"><label for="ratio">Aspect ratio (width:height)</label><input id="ratio" type="text" required placeholder="16:9"><label for="width">Window width (pixels)</label><input id="width" type="number" min="20" max="5000" required><label style="display:flex;align-items:center;gap:10px"><input id="muted" type="checkbox" style="width:auto">Mute audio in this window</label><div class="hint" id="preview"></div><div class="error" id="error"></div><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Apply</button></div></form>
<script>
const $=id=>document.getElementById(id);
window.browserSettings.get().then(c=>{if(!c)return;$('url').value=c.url;$('ratio').value=c.ratio;$('width').value=c.width;$('muted').checked=c.muted===true;preview()});
function preview(){const m=$('ratio').value.match(/^\s*(\d+(?:\.\d+)?)\s*:\s*(\d+(?:\.\d+)?)\s*$/);$('preview').textContent=m&&+m[1]&&+m[2]?`Calculated height: ${Math.round(+$('width').value*+m[2]/+m[1])} px`:''}
$('ratio').addEventListener('input',preview);$('width').addEventListener('input',preview);
$('cancel').onclick=()=>window.browserSettings.cancel();
$('settings').onsubmit=async e=>{e.preventDefault();$('error').textContent='';try{await window.browserSettings.save({url:$('url').value,ratio:$('ratio').value,width:$('width').value,muted:$('muted').checked})}catch(err){$('error').textContent=err.message}};
</script></body></html>
